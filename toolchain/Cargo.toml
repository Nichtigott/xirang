[package]
name = "xirang-toolchain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/Nichtigott/xirang"
homepage = "https://github.com/Nichtigott/xirang"
description = "The seven thin execution surfaces of XiRang in one crate"
keywords = ["registration", "cli", "studio", "bridge", "toolchain"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"
autobins = false
autotests = false
autoexamples = false

[lib]
name = "xirang_toolchain"
path = "src/lib.rs"

[features]
# The host-facing half of the package must not drag a TUI in by default.
# 宿主面向的那一半不能默认拖进 TUI。
default = ["build", "run"]

# ── Host-facing (two halves: `[build-dependencies]` and `[dependencies]`)
# ── 宿主面向（两半，分别对应 build-dependencies 与 dependencies）
build = ["xirang-kernel/syntax", "dep:syn", "dep:proc-macro2", "dep:serde_json"]  # module build_method
run = ["dep:xirang-macro"]                                                        # module runtime

# ── Execution surfaces (the names of their own public API gates, unchanged)
# ── 执行面（今天各自的公开 API 门控，名字不变）
authoring = ["run", "xirang-kernel/syntax", "dep:syn"]
evidence = ["run", "dep:inventory", "dep:petgraph", "dep:tracing"]  # module call_evidence
plugins = ["run", "dep:arc-swap", "dep:ed25519-dalek"]              # module plugin_host
wasm = ["plugins", "dep:wasmi"]
process-tools = ["plugins", "dep:tempfile"]
node-graph = ["dep:rataflow"]
studio = ["build", "run", "authoring", "evidence", "dep:crossterm", "dep:notify", "dep:ratatui", "dep:serde_json", "xirang-multilang/production"]
mcp = ["build", "run", "authoring", "evidence", "dep:serde_json", "xirang-multilang/production", "xirang-multilang/semantics", "native-record"]
cli = ["build", "run", "studio", "mcp", "dep:serde_json"]  # umbrella: xirang-toolchain's closure

# ── Language implementations (opt-in, one feature per language)
# ── 语言实现（可选，每种语言一个特性）
lang-cpp = ["xirang-multilang/lang-cpp", "native-record"]
lang-python = ["xirang-multilang/lang-python"]
lang-zig = ["xirang-multilang/lang-zig", "native-record"]
lang-c = ["xirang-multilang/lang-c", "native-record"]
lang-js = ["xirang-multilang/lang-js"]
lang-ts = ["xirang-multilang/lang-ts"]
lang-go = ["xirang-multilang/lang-go"]
lang-java = ["xirang-multilang/lang-java"]
lang-csharp = ["xirang-multilang/lang-csharp"]
native-record = ["xirang-multilang/native-record"]

# ── Workspace-only (never in the published surface)
# ── 仅工作区（不进发布面）
prototype-fixtures = []
dev-supervisor = []

[[bin]]
name = "xirang"
path = "src/bin/xirang.rs"
required-features = ["cli"]

[[bin]]
name = "cargo-xirang"
path = "src/bin/cargo-xirang.rs"
required-features = ["cli"]

[[bin]]
name = "xirang-mcp"
path = "src/bin/xirang-mcp.rs"
required-features = ["mcp"]

[[bin]]
name = "xirang-studio"
path = "src/bin/xirang-studio.rs"
required-features = ["studio"]

[[bin]]
name = "xirang-dev"
path = "src/bin/xirang-dev.rs"
required-features = ["dev-supervisor", "studio"]

# Dependencies merged from the seven execution surfaces.
[dependencies]
xirang-kernel = { workspace = true, features = ["syntax"] }
proc-macro2 = { optional = true, version = "1", features = ["span-locations"] }
serde_json = { version = "1", optional = true }
syn = { version = "2", features = ["full", "parsing", "visit"], optional = true}
xirang-macro = { workspace = true, optional = true }
xirang-multilang = { workspace = true }
petgraph = { version = "0.8", optional = true }
tracing = { version = "0.1", optional = true }
inventory = { version = "0.3.24", optional = true }
arc-swap = { version = "1.9", optional = true }
ed25519-dalek = { optional = true, version = "2", default-features = false, features = ["std"] }
tempfile = { version = "3.22", optional = true }
wasmi = { version = "1.0.9", default-features = false, features = ["std"], optional = true }
crossterm = { version = "0.29", optional = true }
notify = { version = "7", optional = true }
ratatui = { optional = true, version = "0.30", default-features = false, features = ["all-widgets", "crossterm", "layout-cache"] }
rataflow = { version = "0.1", optional = true, default-features = false, features = ["crossterm"] }
[dev-dependencies]
wat = "1"

