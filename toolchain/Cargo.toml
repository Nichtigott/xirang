# The six files that arrived in batch 2 without a target (they were left inside their module
# trees, where the macro chain's tolerant arm cannot be reached from inside the crate). They are
# integration tests now: as external callers they reach that arm the way every other
# `runtime_external_*` target does, which is what the audit's `(b)` residue needed.
# 批 2 里没能接上 target 的六个文件（它们被留在各自模块树中，而宏链的宽容分支在 crate 内部
# 到达不了）。现在它们是集成测试：作为外部调用者，它们与其他 `runtime_external_*` target 一样
# 能到达那个分支——这正是审计 `(b)` 遗留所需要的。
[[test]]
name = "runtime_face_arm_defaults"
path = "tests/runtime_face_arm_defaults.rs"

[[test]]
name = "runtime_face_fields"
path = "tests/runtime_face_fields.rs"

# H/A2e's acceptance in miniature: one declaration written both ways must yield one `RegistrationInfo`.
# It carries no `required-features` for the same reason `runtime_face_fields` does not — the macros, the
# identity types and the assembly are all reachable under the default features and under none of them.
# H/A2e 的袖珍验收：同一份声明的两种拼法必须产出同一份 `RegistrationInfo`。它和不带 `required-features`
# 的 `runtime_face_fields` 同理——宏、身份类型与拼装，在默认特性下与一个特性都不开时都可达。
[[test]]
name = "face_forms_agree"
path = "tests/face_forms_agree.rs"

# The declaration macros read `crate::XIRANG_NAMESPACE` (audit `M7`, P3.3), so this target proves
# they read the constant rather than the package name. It carries **no** `required-features`: the
# macros and `NodeId` are reachable under the default features *and* under none of them, and naming a
# default feature here would keep nothing out (the `features` gate refuses exactly that).
# 声明宏读 `crate::XIRANG_NAMESPACE`（审计 `M7`，P3.3），因此这个 target 证明它们读的是常量而不是包名。
# 它**不**声明 `required-features`：宏与 `NodeId` 在默认特性下与一个特性都不开时都可达，而在这里点名一个
# 默认特性什么也挡不住（`features` 门禁拒绝的正是这个）。
[[test]]
name = "namespace_constant"
path = "tests/namespace_constant.rs"

[[test]]
name = "runtime_face_preset_parts"
path = "tests/runtime_face_preset_parts.rs"

[[test]]
name = "runtime_kind_only_registry_name"
path = "tests/runtime_kind_only_registry_name.rs"

[[test]]
name = "runtime_path_compat"
path = "tests/runtime_path_compat.rs"

[[example]]
name = "scale_audit"
path = "examples/scale_audit.rs"

#  is an IDE-only gate the runtime surface already carried; declare it so
#  (unexpected_cfgs) stays clean.
#  是该执行面原有的仅 IDE 门控；在此登记，使 clippy 的 unexpected_cfgs 保持为 0。
[[test]]
