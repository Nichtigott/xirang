<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">息壤：让代码产生自身结构</title>
  <desc id="desc">同一对象的三个维度：注册关系、源码落点与编译归属。Area 属于 Panel，可位于 components 目录并交给生成 crate 编译；这些路径不等于稳定对象身份。</desc>
  <defs>
    <radialGradient id="light" cx="80%" cy="0%" r="90%"><stop stop-color="#343024"/><stop offset="1" stop-color="#0d1110"/></radialGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#a29478" stroke-width="1.2"/></marker>
  </defs>
  <rect width="1200" height="580" rx="20" fill="#0d1110"/>
  <rect x="1" y="1" width="1198" height="578" rx="20" fill="url(#light)" stroke="#393b32"/>
  <g font-family="DejaVu Sans, Noto Sans CJK SC, Microsoft YaHei, Sarasa Gothic SC, sans-serif">
    <g fill="none" stroke="#d8bb82" stroke-width="4" stroke-linecap="round">
      <path d="M78 105V81L59 65M78 81L97 65M55 114H101"/>
      <circle cx="56" cy="61" r="5"/><circle cx="100" cy="61" r="5"/>
    </g>
    <text x="124" y="101" fill="#f4f1e9" font-size="48" font-weight="600" letter-spacing="-2">XiRang</text>
    <text x="56" y="181" fill="#f4f1e9" font-size="42" font-weight="500" letter-spacing="-1">让代码产生自己的工程结构</text>
    <text x="58" y="225" fill="#b5b7ad" font-size="20">同一对象，分别表达逻辑关系、源码落点与编译归属。</text>
    <g stroke="#44483d" fill="#141915">
      <rect x="56" y="279" width="336" height="216" rx="12"/>
      <rect x="432" y="279" width="336" height="216" rx="12"/>
      <rect x="808" y="279" width="336" height="216" rx="12"/>
    </g>
    <g fill="#d8bb82" font-size="14" letter-spacing="2">
      <text x="80" y="314">逻辑关系</text><text x="456" y="314">源码落点</text><text x="832" y="314">编译归属</text>
    </g>
    <g fill="#eeeae0" font-size="25">
      <text x="80" y="355">对象属于哪里</text><text x="456" y="355">团队在哪里维护</text><text x="832" y="355">交给哪个包编译</text>
    </g>
    <path d="M100 388V434H130" stroke="#d8bb82" stroke-width="2" fill="none"/>
    <g font-family="DejaVu Sans Mono, Sarasa Mono SC, monospace" font-size="19">
      <text x="116" y="399" fill="#aeb6aa">Panel</text><text x="143" y="441" fill="#f1d6a0">Area</text>
      <text x="456" y="405" fill="#aeb6aa">components/area/</text><text x="456" y="442" fill="#f1d6a0">area.cpp</text>
      <text x="832" y="405" fill="#aeb6aa">host → objects</text><text x="832" y="442" fill="#f1d6a0">生成的 crate</text>
    </g>
    <path d="M399 389H423M775 389H799" stroke="#a29478" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="58" y="542" fill="#c0c2b7" font-size="18">人与 AI、编译器与编辑器共享同一套工程结构。</text>
    <text x="1143" y="542" text-anchor="end" fill="#a29478" font-size="13" letter-spacing="2">理念示意</text>
  </g>
</svg>
