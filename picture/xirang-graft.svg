<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1480" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Graft: choose exactly what to replace.</title><desc id="desc">Four independent base-to-effective tree comparisons: a single face, multiple cuts, an intermediate layer retaining children, and a complete subtree. Labels show slot name then implementation kind. Gold marks replacements. Base and external trees are unchanged.</desc>
