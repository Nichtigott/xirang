<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1480" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">嫁接：明确选择需要替换的范围</title><desc id="desc">四种相互独立的基树到有效树对照：局部单面替换、多个切口群替换、中间层替换但保留子级、整子树替换。点号左侧为槽位名，右侧为实现类型。金色是替换后的实现；基树和外部树保持原样。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#d8bb82" stroke-width="1.5"/></marker><style>text{font-family:DejaVu Sans,"Noto Sans CJK SC","Microsoft YaHei","PingFang SC","Sarasa Gothic SC",Arial,sans-serif}</style></defs><rect width="1200" height="1480" rx="24" fill="#101412"/>
