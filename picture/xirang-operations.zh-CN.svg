<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1180" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">在树上看懂三种工程操作</title><desc id="desc">移动改变父级，嫁接改变槽位绑定的实现，分区改变子树的编译归属。金色标记变化，灰色表示保留的结构。</desc>
