[package]
name = "xirang-example-control-button-graft"
version = "0.1.0"
edition = "2024"
publish = false
description = "XiRang example: an out-of-project implementation that grafts over the Control/Button tree."

[lib]
name = "control_button_graft"
path = "src/lib.rs"

[dependencies]
xirang-toolchain = { path = "../../toolchain", version = "0.2.2", features = ["run", "authoring"] }

# This crate declares faces but has no build script, so nothing passes
# `--check-cfg` for it. The IDE-only field splice uses `cfg(rust_analyzer)`,
[lints.rust]
